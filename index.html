<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Math Bot</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #f7d6e0, #fde2e4);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 400px;
        }
        h2 { 
            color: #d8737f;
            font-size: 26px;
        }
        input {
            width: 85%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #d8737f;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            background: #ffe6eb;
        }
        button {
            width: 90%;
            padding: 12px;
            margin: 5px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }
        .btn1 { background: #f5a9b8; }
        .btn2 { background: #fbc3bc; }
        .btn3 { background: #b5e2fa; }
        .btn4 { background: #a1c4fd; }
        button:hover { opacity: 0.85; transform: scale(1.05); }
        .result {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Math Bot😛</h2>
        <input type="number" id="a" placeholder="Enter value for a">
        <input type="number" id="b" placeholder="Enter value for b">
        <button onclick="calculate('product')" class="btn1">Multiply</button>
        <button onclick="calculate('power')" class="btn2">Power</button>
        <button onclick="calculate('remainder')" class="btn3">Remainder</button>
        <button onclick="calculate('equal')" class="btn4">Check Equality</button>
        <p id="result" class="result"></p>
    </div>
    <script>
        function calculate(operation) {
            let a = parseFloat(document.getElementById("a").value);
            let b = parseFloat(document.getElementById("b").value);
            let result = "";
            if (isNaN(a) || isNaN(b)) {
                result = "Enter valid numbers!";
            } else {
                switch (operation) {
                    case 'product': result = `Product: ${a * b}`; break;
                    case 'power': result = `a^b: ${Math.pow(a, b)}`; break;
                    case 'remainder': result = `Remainder: ${a % b}`; break;
                    case 'equal': result = a === b ? "Equal" : "Not Equal"; break;
                }
            }
            document.getElementById("result").innerText = result;
        }
    </script>
</body>
</html
